name: Build Video Downloader (Windows)

on:
  push:
    branches: [main]
    paths:
      - "Video-Downloader/web_application/**"
      - ".github/workflows/build-video-downloader-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Video-Downloader/web_application
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name VideoDownloader `
            --add-data "templates;templates" `
            desktop_app.py

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows
          path: Video-Downloader/web_application/dist/VideoDownloader.exe
